name: Sai control contract
on:
  pull_request:
    paths: ['TuanjieProject/Assets/SaiAgent001/**', 'tests/sai_contract_console/**', 'tests/sai_native_console/**', 'scripts/setup-sai*.py', '.github/workflows/sai-contract.yml']
  push:
    branches: ['feat/sai-agent-001']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/sai_contract_console -- tests/sai_contract_console/python-fixtures.json
      - run: dotnet run --project tests/sai_contract_console -- tests/sai_contract_console/python-stair-fixtures.json
  native-physics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install mujoco==3.12.0
      - run: python scripts/setup-sai-agent.py
      - run: python scripts/setup-sai-native-test.py
      - run: dotnet run --project tests/sai_native_console -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sai-native-${{ matrix.os }}
          path: artifacts/sai-native-test/result.json
